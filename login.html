<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alansi Car Rental | Login</title>
    <link rel="stylesheet" href="/style.css">

    <script>
        function validateLogin() {

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (username === "" || password === "") {
                alert("All fields are required.");
                return false;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return false;
            }

            return true;
        }
    </script>

</head>

<body>

    <header class="site-header">
        <div class="container topbar">

            <div class="brand">
                <img src="/images/logo.png" alt="logo" class="logo">
                <div>
                    <p class="brand-name">Alansi Car Rental</p>
                    <p class="brand-tag">Reliable cars for daily use in Qatar</p>
                </div>
            </div>

            <nav>
                <ul class="nav-list">
                    <li><a href="/home.html">Home</a></li>
                    <li><a href="/products.html">Products</a></li>
                    <li><a href="/login.html" class="active">Login</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="review.html">Reviews</a></li>
                    <li><a href="booking.html">Booking</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main>

        <section style="padding: 60px 0; background: #eaf0f7;">
            <div class="container">

                <h1 style="text-align:center;">Login</h1>

                <form id="loginForm" action="https://sit.udst.edu.qa/processform.php" method="POST"
                    onsubmit="return validateLogin()">

                    <label>Username</label>
                    <input type="text" id="username" name="username">

                    <label>Password</label>
                    <input type="password" id="password" name="password">

                    <div style="text-align:center; margin-top:20px;">
                        <button type="submit" class="btn-submit">Login</button>
                        <button type="reset" class="btn-reset">Reset</button>
                    </div>

                    <p style="text-align:center; margin-top:15px;">
                        Don't have an account?
                        <a href="subscribe.html">Subscribe here</a>
                    </p>

                </form>

            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>© 2026 Alansi Car Rental</p>
        </div>
    </footer>

</body>

</html>
